<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Register // Leather & Quill Studio</title>

<!-- Website Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236a2c3e'/%3E%3Cstop offset='100%25' stop-color='%23471825'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 6 L78 6 A16 16 0 0 1 94 22 L94 50 A44 44 0 0 1 50 94 L22 94 A16 16 0 0 1 6 78 L6 50 A44 44 0 0 1 50 6 Z' fill='url(%23g)' stroke='%23d4a373' stroke-width='6'/%3E%3Cpath d='M68 28 C68 28 56 32 46 44 C36 56 30 70 28 72 C26 74 28 70 32 64 C38 54 50 42 62 34 C68 28 68 28 68 28 Z' fill='%23fdf0e3'/%3E%3Cpath d='M29 71 L20 80' stroke='%23fdf0e3' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M52 40 L59 47 M44 48 L51 55 M36 56 L42 62' stroke='%23fdf0e3' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="fontawesome/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
html {
    box-sizing: border-box;
    overflow-x: hidden;
    width: 100%;
    max-width: 100%;
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: inherit;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #fbf6f9;
    color: #381420;
    transition: background 0.3s ease, color 0.3s ease;
    overflow-y: auto;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    word-break: break-word;
}

/* Dark Mode Theme */
body.dark-mode {
    background: #1a111a;
    color: #e8dfe8;
}

body.dark-mode .navbar {
    background: rgba(26, 26, 26, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

body.dark-mode .logo-text .logo-main {
    color: #d4a373;
}

body.dark-mode .logo-text .logo-sub {
    color: #bda4aa;
}

body.dark-mode .icon-btn {
    background: rgba(255, 255, 255, 0.05);
    color: #d8ccce;
}

body.dark-mode .icon-btn:hover {
    background: #d4a373;
    color: #1a111a;
}

body.dark-mode .reg-card {
    background: rgba(36, 26, 30, 0.65);
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

body.dark-mode .reg-card h2 {
    color: #fdf0e3;
}

body.dark-mode .form-label {
    color: #d4a373;
}

body.dark-mode .form-input {
    background: rgba(0, 0, 0, 0.4);
    border-color: rgba(255, 255, 255, 0.1);
    color: white;
}

body.dark-mode .form-input:focus {
    border-color: #d4a373;
    background: rgba(0, 0, 0, 0.6);
}

body.dark-mode .social-btn {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.1);
    color: #e8dfe8;
}

body.dark-mode .social-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: #d4a373;
    color: #d4a373;
}

body.dark-mode .login-text a {
    color: #d4a373;
}

/* RTL Layout */
body.rtl {
    direction: rtl;
}

.theme-rtl-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 12px;
    z-index: 2000;
}

body.rtl .theme-rtl-controls {
    right: auto;
    left: 20px;
}

body.rtl .navbar {
    padding: 12px 20px 12px 40px;
}

body.rtl .nav-actions {
    right: auto;
    left: 20px;
}

body.rtl .logo {
    margin-right: 0;
}

body.rtl .form-input {
    padding: 14px 45px 14px 16px;
}

body.rtl .input-icon {
    left: auto;
    right: 16px;
}

body.rtl .eye-btn {
    right: auto;
    left: 16px;
}

body.rtl .check-box {
    direction: rtl;
}

/* Navbar Container */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    box-sizing: border-box;
}

/* Logo Section */
.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: transform 0.3s ease;
    flex-shrink: 0;
}

.logo:hover {
    transform: scale(1.02);
}

.logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #6a2c3e, #471825);
    border-radius: 50% 12px 50% 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(106, 44, 62, 0.4);
    border: 2px solid #d4a373;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    flex-shrink: 0;
}

.logo:hover .logo-icon {
    transform: rotate(15deg) scale(1.1);
    border-radius: 12px 50% 12px 50%;
}

.logo-icon i {
    font-size: 20px;
    color: #fdf0e3;
    z-index: 1;
}

.logo-icon::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
}

.logo:hover .logo-icon::before {
    transform: translateX(100%);
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-main {
    font-family: 'Playfair Display', serif;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: 800;
    color: #381420;
    letter-spacing: 1px;
    line-height: 1.2;
}

.logo-sub {
    font-size: clamp(7px, 1.8vw, 9px);
    font-weight: 500;
    color: #965b6b;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* Right Side Actions - Moved to Navbar */
.nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.03);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s ease;
    color: #381420;
    position: relative;
}

.icon-btn:hover {
    background: #6a2c3e;
    color: white;
    transform: translateY(-2px);
}

/* Tooltip */
.icon-btn::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -35px;
    left: 50%;
    transform: translateX(-50%);
    background: #381420;
    color: white;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: none;
}

.icon-btn:hover::after {
    opacity: 1;
    visibility: visible;
    bottom: -30px;
}

/* Main Registration Body */
.main-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 40px;
    position: relative;
}

/* Elegant Radial Backlights */
.main-wrapper::before {
    content: '';
    position: absolute;
    width: 50vw;
    height: 50vw;
    max-width: 650px;
    max-height: 650px;
    background: radial-gradient(circle, rgba(212, 163, 115, 0.15) 0%, transparent 70%);
    top: 15%;
    left: -10%;
    z-index: 0;
    pointer-events: none;
}

.main-wrapper::after {
    content: '';
    position: absolute;
    width: 45vw;
    height: 45vw;
    max-width: 550px;
    max-height: 550px;
    background: radial-gradient(circle, rgba(106, 44, 62, 0.12) 0%, transparent 70%);
    bottom: 5%;
    right: -5%;
    z-index: 0;
    pointer-events: none;
}

.reg-card {
    width: 100%;
    max-width: 680px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(106, 44, 62, 0.08);
    border-radius: 24px;
    padding: 45px 50px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(106, 44, 62, 0.08);
    position: relative;
    z-index: 1;
    animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes scaleUp {
    from {
        opacity: 0;
        transform: scale(0.96) translateY(15px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.reg-header {
    text-align: center;
    margin-bottom: 35px;
}

.reg-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 800;
    color: #381420;
    margin-bottom: 8px;
}

.reg-header p {
    font-size: 13px;
    color: #7a5260;
}

.header-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
    cursor: default;
}


.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    position: relative;
    margin-bottom: 20px;
}

.form-grid .form-group {
    margin-bottom: 0;
}

.form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6a2c3e;
    margin-bottom: 8px;
}

.input-container {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 16px;
    color: #965b6b;
    font-size: 14px;
    transition: color 0.3s ease;
    pointer-events: none;
}

.form-input {
    width: 100%;
    padding: 14px 16px 14px 45px;
    background: white;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    font-size: 13px;
    color: #381420;
    outline: none;
    transition: all 0.3s ease;
}

.form-input:focus {
    border-color: #6a2c3e;
    box-shadow: 0 0 0 4px rgba(106, 44, 62, 0.08);
}

.form-input:focus ~ .input-icon {
    color: #6a2c3e;
}

body.dark-mode .form-input:focus ~ .input-icon {
    color: #d4a373;
}

.eye-btn {
    position: absolute;
    right: 16px;
    background: none;
    border: none;
    color: #965b6b;
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.2s ease;
}

.eye-btn:hover {
    color: #6a2c3e;
}

body.dark-mode .eye-btn {
    color: #c4b3b8;
}

body.dark-mode .eye-btn:hover {
    color: #d4a373;
}

.check-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
}

.check-box {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    font-size: 12px;
    color: #63434d;
    user-select: none;
    line-height: 1.5;
}

body.dark-mode .check-box {
    color: #c4b3b8;
}

.check-box input {
    accent-color: #6a2c3e;
    width: 16px;
    height: 16px;
    cursor: pointer;
    margin-top: 1px;
    flex-shrink: 0;
}

body.dark-mode .check-box input {
    accent-color: #d4a373;
}

.check-box a {
    color: #6a2c3e;
    font-weight: 600;
    text-decoration: none;
}

.check-box a:hover {
    text-decoration: underline;
}

body.dark-mode .check-box a {
    color: #d4a373;
}

.btn-main {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #6a2c3e, #471825);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(106, 44, 62, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(106, 44, 62, 0.35);
    background: linear-gradient(135deg, #d4a373, #b87333);
    color: #15060b;
}

body.dark-mode .btn-main {
    background: linear-gradient(135deg, #d4a373, #b87333);
    color: #15060b;
    box-shadow: 0 8px 20px rgba(212, 163, 115, 0.2);
}

body.dark-mode .btn-main:hover {
    background: linear-gradient(135deg, #fdf0e3, #d4a373);
    box-shadow: 0 12px 25px rgba(212, 163, 115, 0.3);
}

.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 25px 0;
    color: #965b6b;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

body.dark-mode .divider {
    color: #bda4aa;
}

.divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

body.dark-mode .divider::before, body.dark-mode .divider::after {
    border-bottom-color: rgba(255, 255, 255, 0.08);
}

.divider::before { margin-right: 12px; }
.divider::after { margin-left: 12px; }

.social-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.social-btn {
    padding: 12px;
    background: white;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 12px;
    color: #381420;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
}

.social-btn:hover {
    transform: translateY(-2px);
    border-color: #6a2c3e;
    color: #6a2c3e;
    box-shadow: 0 5px 15px rgba(106, 44, 62, 0.08);
}

.login-text {
    text-align: center;
    font-size: 12px;
    color: #7a5260;
}

body.dark-mode .login-text {
    color: #c4b3b8;
}

.login-text a {
    color: #6a2c3e;
    font-weight: 700;
    text-decoration: none;
    transition: color 0.2s ease;
    margin-left: 4px;
}

.login-text a:hover {
    text-decoration: underline;
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    .reg-card {
        padding: 35px 25px;
    }
    .navbar {
        padding: 12px 20px;
    }
}

@media (max-width: 480px) {
    .reg-card { padding: 30px 15px; }
    .logo-icon { width: 44px; height: 44px; }
    .logo-icon i { font-size: 18px; }
    .logo-main { font-size: 12px; }
    .logo-sub { font-size: 7px; }
    .reg-header h2 { font-size: 22px; }
}
</style>
</head>
<body>
    <div class="theme-rtl-controls">
        <button id="darkModeToggle" class="icon-btn" data-tooltip="Toggle Dark Mode">
            <i class="fas fa-moon"></i>
        </button>
        <button id="rtlToggle" class="icon-btn" data-tooltip="Toggle RTL">
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- MAIN REGISTRATION WRAPPER -->
    <div class="main-wrapper">
        <div class="reg-card">
            <div class="reg-header auth-header">
                <div class="header-logo">
                    <a href="./index.html" class="logo">
                        <div class="logo-icon">
                            <i class="fas fa-feather-alt"></i>
                        </div>
                        <div class="logo-text">
                            <span class="logo-main">LEATHER & QUILL</span>
                            <span class="logo-sub">HANDCRAFTED JOURNALS</span>
                        </div>
                    </a>
                </div>
                <h2>Studio Patronage Pass</h2>
                <p>Register your identity to commission bespoke leather works</p>
            </div>

            <form id="regForm" onsubmit="executeRegistrationFlow(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-container">
                        <input type="email" class="form-input" placeholder="patron@studio.com" required id="regEmail">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Create Studio Passcode</label>
                    <div class="input-container">
                        <input type="password" class="form-input" placeholder="••••••••••••" required id="regPass1">
                        <i class="fas fa-lock input-icon"></i>
                        <!-- Password Eye Icon Button -->
                        <button type="button" class="eye-btn" onclick="toggleRegPasswordView('regPass1', 'passEyeIcon1')" title="Show entire password">
                            <i class="fas fa-eye" id="passEyeIcon1"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Passcode</label>
                    <div class="input-container">
                        <input type="password" class="form-input" placeholder="••••••••••••" required id="regPass2">
                        <i class="fas fa-lock-open input-icon"></i>
                        <button type="button" class="eye-btn" onclick="toggleRegPasswordView('regPass2', 'passEyeIcon2')" title="Show entire password">
                            <i class="fas fa-eye" id="passEyeIcon2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-main">
                    <i class="fas fa-user-plus"></i>
                    <span>Secure Access Pass</span>
                </button>
            </form>

            <div class="divider">Or Authenticate Immediately Via</div>

            <div class="social-grid">
                <button type="button" class="social-btn" onclick="executeSocialRegister('Google')" title="Register via Google">
                    <i class="fab fa-google" style="color: #ea4335;"></i>
                </button>
                <button type="button" class="social-btn" onclick="executeSocialRegister('Facebook')" title="Register via Facebook">
                    <i class="fab fa-facebook-f" style="color: #1877f2;"></i>
                </button>
                <button type="button" class="social-btn" onclick="executeSocialRegister('Apple')" title="Register via Apple">
                    <i class="fab fa-apple"></i>
                </button>
            </div>

            <div class="login-text">
                <span>Already carry assigned ledger keys?</span>
                <a href="./login.html">Log In</a>
            </div>
        </div>
    </div>

    <script>
        const darkModeToggle = document.getElementById('darkModeToggle');
        const rtlToggle = document.getElementById('rtlToggle');
        const body = document.body;

        // Dark Mode Logic
        function toggleDarkMode() {
            body.classList.toggle('dark-mode');
            const icon = darkModeToggle?.querySelector('i');
            if (body.classList.contains('dark-mode')) {
                if (icon) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                }
                localStorage.setItem('darkMode', 'enabled');
            } else {
                if (icon) {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        // RTL Logic
        function toggleRTL() {
            body.classList.toggle('rtl');
            const icon = rtlToggle?.querySelector('i');
            if (body.classList.contains('rtl')) {
                if (icon) {
                    icon.classList.remove('fa-arrow-right');
                    icon.classList.add('fa-arrow-left');
                }
                localStorage.setItem('rtlMode', 'enabled');
            } else {
                if (icon) {
                    icon.classList.remove('fa-arrow-left');
                    icon.classList.add('fa-arrow-right');
                }
                localStorage.setItem('rtlMode', 'disabled');
            }
        }

        darkModeToggle?.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDarkMode();
        });

        rtlToggle?.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleRTL();
        });

        // Load preferences on boot
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            if (darkModeToggle) {
                darkModeToggle.querySelector('i').classList.remove('fa-moon');
                darkModeToggle.querySelector('i').classList.add('fa-sun');
            }
        }

        if (localStorage.getItem('rtlMode') === 'enabled') {
            body.classList.add('rtl');
            if (rtlToggle) {
                rtlToggle.querySelector('i').classList.remove('fa-arrow-right');
                rtlToggle.querySelector('i').classList.add('fa-arrow-left');
            }
        }

        // Eye Icon Toggle Function
        function toggleRegPasswordView(inputId, iconId) {
            const passField = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (passField.type === 'password') {
                passField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Registration Submitting Engine
        function executeRegistrationFlow(e) {
            e.preventDefault();
            const p1 = document.getElementById('regPass1').value;
            const p2 = document.getElementById('regPass2').value;

            if (p1 !== p2) {
                alert('Verification Audit Failed: Provided passcodes do not match. Please review character inputs.');
                return;
            }

            const name = document.getElementById('regName').value;
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('activePatron', name);

            const btn = document.querySelector('.btn-main');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Securing Registry Ledger...';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                alert(`Welcome to the Craft, ${name}!\n\nYour bespoke key has been forged successfully. Proceeding to the main study layout.`);
                window.location.href = './index.html';
            }, 900);
        }

        function executeSocialRegister(provider) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('activePatron', provider + ' Collector');

            const btn = document.querySelector('.btn-main');
            btn.innerHTML = `<i class="fas fa-check"></i> ${provider} Pass Linked`;
            
            setTimeout(() => {
                window.location.href = './index.html';
            }, 600);
        }
    </script>
