<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Login // Leather & Quill Studio</title>

<!-- Website Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236a2c3e'/%3E%3Cstop offset='100%25' stop-color='%23471825'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 6 L78 6 A16 16 0 0 1 94 22 L94 50 A44 44 0 0 1 50 94 L22 94 A16 16 0 0 1 6 78 L6 50 A44 44 0 0 1 50 6 Z' fill='url(%23g)' stroke='%23d4a373' stroke-width='6'/%3E%3Cpath d='M68 28 C68 28 56 32 46 44 C36 56 30 70 28 72 C26 74 28 70 32 64 C38 54 50 42 62 34 C68 28 68 28 68 28 Z' fill='%23fdf0e3'/%3E%3Cpath d='M29 71 L20 80' stroke='%23fdf0e3' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M52 40 L59 47 M44 48 L51 55 M36 56 L42 62' stroke='%23fdf0e3' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="fontawesome/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
html {
    box-sizing: border-box;
    overflow-x: hidden;
    width: 100%;
    max-width: 100%;
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: inherit;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #fbf6f9;
    color: #381420;
    transition: background 0.3s ease, color 0.3s ease;
    overflow-y: auto;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    word-break: break-word;
}

/* Dark Mode Theme */
body.dark-mode {
    background: #1a111a;
    color: #e8dfe8;
}

body.dark-mode .navbar {
    background: rgba(26, 26, 26, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

body.dark-mode .logo-text .logo-main {
    color: #d4a373;
}

body.dark-mode .logo-text .logo-sub {
    color: #bda4aa;
}

body.dark-mode .icon-btn {
    background: rgba(255, 255, 255, 0.05);
    color: #d8ccce;
}

body.dark-mode .icon-btn:hover {
    background: #d4a373;
    color: #1a111a;
}

body.dark-mode .auth-card {
    background: rgba(36, 26, 30, 0.6);
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

body.dark-mode .auth-card h2 {
    color: #fdf0e3;
}

body.dark-mode .form-label {
    color: #d4a373;
}

body.dark-mode .form-input {
    background: rgba(0, 0, 0, 0.4);
    border-color: rgba(255, 255, 255, 0.1);
    color: white;
}

body.dark-mode .form-input:focus {
    border-color: #d4a373;
    background: rgba(0, 0, 0, 0.6);
}

body.dark-mode .social-btn {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.1);
    color: #e8dfe8;
}

body.dark-mode .social-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: #d4a373;
    color: #d4a373;
}

body.dark-mode .signup-text a {
    color: #d4a373;
}

/* RTL Layout */
body.rtl {
    direction: rtl;
}

.theme-rtl-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 12px;
    z-index: 2000;
}

body.rtl .theme-rtl-controls {
    right: auto;
    left: 20px;
}

body.rtl .navbar {
    padding: 12px 20px 12px 40px;
}

body.rtl .nav-actions {
    right: auto;
    left: 20px;
}

body.rtl .logo {
    margin-right: 0;
}

body.rtl .form-input {
    padding: 14px 45px 14px 16px;
}

body.rtl .input-icon {
    left: auto;
    right: 16px;
}

body.rtl .eye-btn {
    right: auto;
    left: 16px;
}

/* Navbar Container */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    box-sizing: border-box;
}

/* Logo Section */
.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: transform 0.3s ease;
    flex-shrink: 0;
}

.logo:hover {
    transform: scale(1.02);
}

.logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #6a2c3e, #471825);
    border-radius: 50% 12px 50% 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(106, 44, 62, 0.4);
    border: 2px solid #d4a373;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    flex-shrink: 0;
}

.logo:hover .logo-icon {
    transform: rotate(15deg) scale(1.1);
    border-radius: 12px 50% 12px 50%;
}

.logo-icon i {
    font-size: 20px;
    color: #fdf0e3;
    z-index: 1;
}

.logo-icon::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
}

.logo:hover .logo-icon::before {
    transform: translateX(100%);
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-main {
    font-family: 'Playfair Display', serif;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: 800;
    color: #381420;
    letter-spacing: 1px;
    line-height: 1.2;
}

.logo-sub {
    font-size: clamp(7px, 1.8vw, 9px);
    font-weight: 500;
    color: #965b6b;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* Right Side Actions - Moved to Navbar */
.nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.03);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s ease;
    color: #381420;
    position: relative;
}

.icon-btn:hover {
    background: #6a2c3e;
    color: white;
    transform: translateY(-2px);
}

/* Tooltip */
.icon-btn::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -35px;
    left: 50%;
    transform: translateX(-50%);
    background: #381420;
    color: white;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: none;
}

.icon-btn:hover::after {
    opacity: 1;
    visibility: visible;
    bottom: -30px;
}

/* Main Auth Body */
.main-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    position: relative;
}

/* Elegant Background Glows */
.main-wrapper::before {
    content: '';
    position: absolute;
    width: 45vw;
    height: 45vw;
    max-width: 600px;
    max-height: 600px;
    background: radial-gradient(circle, rgba(212, 163, 115, 0.15) 0%, transparent 70%);
    top: 20%;
    left: -10%;
    z-index: 0;
    pointer-events: none;
}

.main-wrapper::after {
    content: '';
    position: absolute;
    width: 40vw;
    height: 40vw;
    max-width: 500px;
    max-height: 500px;
    background: radial-gradient(circle, rgba(106, 44, 62, 0.12) 0%, transparent 70%);
    bottom: 5%;
    right: -5%;
    z-index: 0;
    pointer-events: none;
}

.auth-card {
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(106, 44, 62, 0.08);
    border-radius: 24px;
    padding: 45px 40px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(106, 44, 62, 0.08);
    position: relative;
    z-index: 1;
    animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes scaleUp {
    from {
        opacity: 0;
        transform: scale(0.96) translateY(15px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 800;
    color: #381420;
    margin-bottom: 6px;
}

.auth-header p {
    font-size: 13px;
    color: #7a5260;
}

.header-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
    cursor: default;
}


.form-group {
    margin-bottom: 20px;
    position: relative;
}

.form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6a2c3e;
    margin-bottom: 8px;
}

.input-container {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 16px;
    color: #965b6b;
    font-size: 14px;
    transition: color 0.3s ease;
}

.form-input {
    width: 100%;
    padding: 14px 16px 14px 45px;
    background: white;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    font-size: 13px;
    color: #381420;
    outline: none;
    transition: all 0.3s ease;
}

.form-input:focus {
    border-color: #6a2c3e;
    box-shadow: 0 0 0 4px rgba(106, 44, 62, 0.08);
}

.form-input:focus ~ .input-icon {
    color: #6a2c3e;
}

body.dark-mode .form-input:focus ~ .input-icon {
    color: #d4a373;
}

.eye-btn {
    position: absolute;
    right: 16px;
    background: none;
    border: none;
    color: #965b6b;
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.2s ease;
}

.eye-btn:hover {
    color: #6a2c3e;
}

body.dark-mode .eye-btn {
    color: #c4b3b8;
}

body.dark-mode .eye-btn:hover {
    color: #d4a373;
}

.form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
    font-size: 12px;
}

.remember-box {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: #63434d;
    user-select: none;
}

body.dark-mode .remember-box {
    color: #c4b3b8;
}

.remember-box input {
    accent-color: #6a2c3e;
    width: 15px;
    height: 15px;
    cursor: pointer;
}

body.dark-mode .remember-box input {
    accent-color: #d4a373;
}

.forgot-link {
    color: #6a2c3e;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
}

.forgot-link:hover {
    text-decoration: underline;
}

body.dark-mode .forgot-link {
    color: #d4a373;
}

.btn-main {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6a2c3e, #471825);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(106, 44, 62, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(106, 44, 62, 0.35);
    background: linear-gradient(135deg, #d4a373, #b87333);
    color: #15060b;
}

body.dark-mode .btn-main {
    background: linear-gradient(135deg, #d4a373, #b87333);
    color: #15060b;
    box-shadow: 0 8px 20px rgba(212, 163, 115, 0.2);
}

body.dark-mode .btn-main:hover {
    background: linear-gradient(135deg, #fdf0e3, #d4a373);
    box-shadow: 0 12px 25px rgba(212, 163, 115, 0.3);
}

.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 24px 0;
    color: #965b6b;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

body.dark-mode .divider {
    color: #bda4aa;
}

.divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

body.dark-mode .divider::before, body.dark-mode .divider::after {
    border-bottom-color: rgba(255, 255, 255, 0.08);
}

.divider::before { margin-right: 12px; }
.divider::after { margin-left: 12px; }

.social-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.social-btn {
    padding: 12px;
    background: white;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 12px;
    color: #381420;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
}

.social-btn:hover {
    transform: translateY(-2px);
    border-color: #6a2c3e;
    color: #6a2c3e;
    box-shadow: 0 5px 15px rgba(106, 44, 62, 0.08);
}

.signup-text {
    text-align: center;
    font-size: 12px;
    color: #7a5260;
}

body.dark-mode .signup-text {
    color: #c4b3b8;
}

.signup-text a {
    color: #6a2c3e;
    font-weight: 700;
    text-decoration: none;
    transition: color 0.2s ease;
    margin-left: 4px;
}

.signup-text a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .auth-card {
        padding: 30px 20px;
    }
    
    .navbar {
        padding: 12px 20px;
    }

    .logo-icon { width: 44px; height: 44px; }
    .logo-icon i { font-size: 18px; }
    .logo-main { font-size: 12px; }
    .logo-sub { font-size: 7px; }
    .auth-header h2 { font-size: 22px; }
}
</style>
</head>
<body>
    <div class="theme-rtl-controls">
        <button id="darkModeToggle" class="icon-btn" data-tooltip="Toggle Dark Mode">
            <i class="fas fa-moon"></i>
        </button>
        <button id="rtlToggle" class="icon-btn" data-tooltip="Toggle RTL">
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>
    <!-- MAIN LOGIN WRAPPER -->
    <div class="main-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="header-logo">
                    <a href="./index.html" class="logo">
                        <div class="logo-icon">
                            <i class="fas fa-feather-alt"></i>
                        </div>
                        <div class="logo-text">
                            <span class="logo-main">LEATHER & QUILL</span>
                            <span class="logo-sub">HANDCRAFTED JOURNALS</span>
                        </div>
                    </a>
                </div>
                <h2>Welcome Back</h2>
                <p>Access your bespoke commissions & registries</p>
            </div>

            <form id="loginForm" onsubmit="executeLoginFlow(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-container">
                        <input type="email" class="form-input" placeholder="patron@studio.com" required id="userEmail">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-container">
                        <input type="password" class="form-input" placeholder="••••••••••••" required id="userPassword">
                        <i class="fas fa-lock input-icon"></i>
                        <!-- Password Eye Icon Button -->
                        <button type="button" class="eye-btn" onclick="togglePasswordView()" title="Show entire password">
                            <i class="fas fa-eye" id="passEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-box">
                        <input type="checkbox" checked id="rememberCheck">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="alert('Password reset link has been dispatched to your verified communication hub.'); return false;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-main">
                    <span>Continue to Studio</span>
                    <i class="fas fa-arrow-right" style="font-size: 12px;"></i>
                </button>
            </form>

            <div class="divider">Continue With</div>

            <div class="social-grid">
                <button type="button" class="social-btn" onclick="executeSocialLogin('Google')" title="Continue with Google">
                    <i class="fab fa-google" style="color: #ea4335;"></i>
                </button>
                <button type="button" class="social-btn" onclick="executeSocialLogin('Facebook')" title="Continue with Facebook">
                    <i class="fab fa-facebook-f" style="color: #1877f2;"></i>
                </button>
                <button type="button" class="social-btn" onclick="executeSocialLogin('Apple')" title="Continue with Apple">
                    <i class="fab fa-apple"></i>
                </button>
            </div>

            <div class="signup-text">
                <span>Don't have an artisan account?</span>
                <a href="./registeration.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        const darkModeToggle = document.getElementById('darkModeToggle');
        const rtlToggle = document.getElementById('rtlToggle');
        const body = document.body;

        // Dark Mode Logic
        function toggleDarkMode() {
            body.classList.toggle('dark-mode');
            const icon = darkModeToggle?.querySelector('i');
            if (body.classList.contains('dark-mode')) {
                if (icon) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                }
                localStorage.setItem('darkMode', 'enabled');
            } else {
                if (icon) {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        // RTL Logic
        function toggleRTL() {
            body.classList.toggle('rtl');
            const icon = rtlToggle?.querySelector('i');
            if (body.classList.contains('rtl')) {
                if (icon) {
                    icon.classList.remove('fa-arrow-right');
                    icon.classList.add('fa-arrow-left');
                }
                localStorage.setItem('rtlMode', 'enabled');
            } else {
                if (icon) {
                    icon.classList.remove('fa-arrow-left');
                    icon.classList.add('fa-arrow-right');
                }
                localStorage.setItem('rtlMode', 'disabled');
            }
        }

        darkModeToggle?.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDarkMode();
        });

        rtlToggle?.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleRTL();
        });

        // Load Prefs on boot
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            if (darkModeToggle) {
                darkModeToggle.querySelector('i').classList.remove('fa-moon');
                darkModeToggle.querySelector('i').classList.add('fa-sun');
            }
        }

        if (localStorage.getItem('rtlMode') === 'enabled') {
            body.classList.add('rtl');
            if (rtlToggle) {
                rtlToggle.querySelector('i').classList.remove('fa-arrow-right');
                rtlToggle.querySelector('i').classList.add('fa-arrow-left');
            }
        }

        // Toggle entire password view
        function togglePasswordView() {
            const passField = document.getElementById('userPassword');
            const eyeIcon = document.getElementById('passEyeIcon');
            if (passField.type === 'password') {
                passField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Execute Auth sequence
        function executeLoginFlow(e) {
            e.preventDefault();
            localStorage.setItem('isLoggedIn', 'true');
            
            const btn = document.querySelector('.btn-main');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            
            setTimeout(() => {
                window.location.href = './index.html';
            }, 800);
        }

        function executeSocialLogin(platform) {
            localStorage.setItem('isLoggedIn', 'true');
            const btn = document.querySelector('.btn-main');
            btn.innerHTML = `<i class="fas fa-check"></i> ${platform} Authorized`;
            
            setTimeout(() => {
                window.location.href = './index.html';
            }, 600);
        }
    </script>
</body>
</html>
